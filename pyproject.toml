[project]
name = "celine-chatbot-api"
version = "1.5.1"
description = "FastAPI RAG chatbot using LlamaIndex + Qdrant + OpenAI"
requires-python = ">=3.12,<3.14"
readme = "README.md" 
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "qdrant-client>=1.10.0",
  "llama-index>=0.14.21",
  "llama-index-vector-stores-qdrant>=0.3.0",
  "llama-index-embeddings-openai>=0.2.0",
  "openai>=1.40.0",
  "markitdown[pdf]>=0.1.5",
  "pymupdf>=1.25.0",
  "Pillow>=11.0.0",
  "python-jose[cryptography]>=3.3.0",
  "fsspec>=2024.6.0",
  "s3fs>=2024.6.0",
  "python-multipart>=0.0.27",
  "celine-sdk>=1.13.0",
  "alembic>=1.18.4",
  "sqlalchemy[asyncio]>=2.0.46",
  "asyncpg>=0.31.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.22.1",
  "debugpy>=1.8.20",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "python-semantic-release>=10.5.3",
]

[tool.uv]
package = true

# The suite reaches no external service: Qdrant, the LLM, PostgreSQL and the three
# platform APIs are all faked at their client boundary. See .agents/playbooks/testing.md.
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # celine-sdk's generated OpenAPI schemas still use Pydantic v1 config. Ours to
  # neither fix nor read past on every run.
  "ignore::pydantic.PydanticDeprecatedSince20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/celine/assistant"]
sources = {"src" = ""}

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
update_pyproject_toml = true 
commit_parser = "conventional"

build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "chore"]
parse_squash_commits = true
ignore_merge_commits = true

