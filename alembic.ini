# alembic.ini — Alembic configuration for celine-ai-assistant
# Run migrations:  alembic upgrade head
# Create revision: alembic revision --autogenerate -m "describe change"

[alembic]
script_location = alembic

# The URL is overridden at runtime in alembic/env.py from app settings,
# so this value is only a fallback for local manual runs.
sqlalchemy.url = sqlite+aiosqlite:///./data/chat_history.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S