services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/uploads &&
      mc mb --ignore-existing local/docs &&
      echo 'MinIO buckets ready'
      "
    restart: "no"

  api-init:
    build: .
    command: .venv/bin/alembic upgrade head

  api:
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./data/app:/app/data
      # optional: mount local docs for quick testing (set DOCS_URI=file:///docs)
      - ./data/local_docs:/app/docs:ro
    ports:
      - "8012:8012"
    depends_on:
      api-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    extra_hosts:
      - "keycloak.celine.localhost:172.17.0.1"
      - "api.celine.localhost:172.17.0.1"

volumes:
  qdrant_data:
  minio_data:
