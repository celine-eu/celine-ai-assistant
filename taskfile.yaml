version: "3"

tasks:
  debug:
    desc: Run FastAPI backend with uv + uvicorn (reload)
    cmds:
      - DEBUG_ATTACH=nowait DEBUG_PORT=48012 .venv/bin/uvicorn celine.assistant.main:create_app --host 0.0.0.0 --port 8012 --reload
    env:
      PYTHONUNBUFFERED: "1"

  setup:
    cmds:
      - uv sync
