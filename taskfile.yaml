version: "3"

tasks:
  run:
    desc: Run FastAPI backend (reload)
    cmds:
      - .venv/bin/uvicorn celine.assistant.main:create_app --host 0.0.0.0 --port 8012 --reload

  debug:
    desc: Debug FastAPI backend with uv + uvicorn (reload)
    cmds:
      - DEBUG_ATTACH=nowait DEBUG_PORT=48012 .venv/bin/uvicorn celine.assistant.main:create_app --host 0.0.0.0 --port 8012 --reload
    env:
      PYTHONUNBUFFERED: "1"

  setup:
    cmds:
      - uv sync

  alembic:migrate:
    desc: "Run migrations"
    cmds:
      - uv run alembic upgrade head

  alembic:sync-model:
    desc: "Create new revision"
    cmds:
      - uv run alembic revision --autogenerate -m \"$MSG\"
    vars:
      MSG: "update model"

  alembic:reset:
    desc: "Reset DB schema"
    cmds:
      - uv run alembic downgrade base

  release:
    cmds:
      - uv run semantic-release -v version --no-vcs-release
      - git push
      - git push --tags
